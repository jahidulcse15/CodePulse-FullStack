<div class="container">

  <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
    <h1>Category Details</h1>

    <a
      class="btn btn-secondary"
      routerLink="/admin/categories"
    >
      Back to Categories
    </a>
  </div>

  @if (categoryResourceRef.isLoading()) {

    <div class="text-center mt-5">
      <div class="spinner-border"></div>
      <p class="mt-2">Loading category...</p>
    </div>

  } @else if (categoryResourceRef.error()) {

    <div class="alert alert-danger">
      Unable to load category.
    </div>

  } @else if (categoryResponse()) {

    <div class="card shadow-sm">

      <div class="card-body">

        <div class="mb-3">
          <label class="form-label fw-bold">ID</label>
          <input
            type="text"
            class="form-control"
            [value]="categoryResponse()?.id"
            disabled
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Name</label>
          <input
            type="text"
            class="form-control"
            [value]="categoryResponse()?.name"
            disabled
          />
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">URL Handle</label>
          <input
            type="text"
            class="form-control"
            [value]="categoryResponse()?.urlHandle"
            disabled
          />
        </div>

        <div class="d-flex gap-2">

          <a
            class="btn btn-primary"
            [routerLink]="['/admin/categories/edit', categoryResponse()?.id]"
          >
            Edit
          </a>

          <a
            class="btn btn-secondary"
            routerLink="/admin/categories"
          >
            Back
          </a>

        </div>

      </div>

    </div>

  }

</div>
