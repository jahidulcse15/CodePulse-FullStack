<div class="container">
    <h1 class="mt-3">Add Category</h1>
    <form [formGroup] ="addcategoryFormContol" (ngSubmit)="onSubmit()">
        <div class="mt-3">
            <label class="form-label">Name</label>
            <input formControlName="name" class="form-control" type="text">
            <div *ngIf="addcategoryFormContol.get('name')?.touched">
                <span class="text-danger small" *ngIf="addcategoryFormContol.get('name')?.hasError('required')">
                    name is required
                </span>
                <span class="text-danger small" *ngIf="addcategoryFormContol.get('name')?.hasError('minlength')">
                    minLength must be greater than 3
                </span>
            </div>
        </div>
        <div class="mt-3">
            <label class="form-label">URL Holder (Slug)</label>
            <input formControlName="urlHandle"  class="form-control" type="text">
            <div *ngIf="addcategoryFormContol.get('urlHandle')?.touched">
                <span class="text-danger small" *ngIf="addcategoryFormContol.get('urlHandle')?.hasError('required')">
                    urlHandle is required.
                </span>
                <span class="text-danger small" *ngIf="addcategoryFormContol.get('urlHandle')?.hasError('minlength')">
                    urlHandle length is greater than 3.
                </span>
            </div>
        </div>
        <div class="mt-3">
            <button [disabled]="addcategoryFormContol.valid===false" type="submit" class="btn btn-primary">Save</button>
        </div>
    </form>
</div>
