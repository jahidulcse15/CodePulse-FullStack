
<div class="container">
    <h1 class="mt-3">Add Blog Post</h1>

    <form (ngSubmit)="onSubmit()" class="mt-3" [formGroup]="addBlogPostForm">

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" formControlName="title">
        </div>

        <div class="mb-3">
            <label class="form-label">Short Description</label>
            <input type="text" class="form-control" formControlName="shortDescription">
        </div>

        <div class="mb-3">
            <label class="form-label">URl Handle</label>
            <input type="text" class="form-control" formControlName="urlHandle">
        </div>

        <div class="mb-3">
            <div class="d-flex flex-row">
                <div class="col-6 p-2">
                    <label class="form-label">Content</label>
                    <textarea class="form-control" formControlName="content" row="5"></textarea>
               </div>
               <div class="col-6 p-2" style="max-height: 350px;overflow-y: scroll;">
                    <markdown [data]="addBlogPostForm.controls.content.getRawValue()"></markdown>
               </div>
            </div>
        </div>

         <div class="mb-3">
            <label class="form-label">Feature Image URL</label>
            <input type="text" class="form-control" formControlName="featureImageUrl">
        </div>

         <div class="mb-3">
            <label class="form-label">Published Date</label>
            <input type="date" class="form-control" formControlName="publishedDate">
        </div>

        <div class="mb-3">
            <label class="form-label">Author</label>
            <input type="text" class="form-control" formControlName="author">
        </div>

        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" formControlName="isVisible" type="checkbox" value="" id="isVisible">
                <label class="form-check-label" for="isVisible">IsVisible?</label>
            </div>
        </div>

        <div class="bt-3">
            <button class="btn btn-primary" type="submit">Save</button>
        </div>
    </form>

</div>
