
<div class="container">
    <h1 class="mt-3">Edit Blog Post</h1>

    <form (ngSubmit)="onSubmit()" class="mt-3" [formGroup]="editBlogPostForm">

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" formControlName="title">
        </div>

        <div class="mb-3">
            <label class="form-label">Short Description</label>
            <input type="text" class="form-control" formControlName="shortDescription">
        </div>

        <div class="mb-3">
            <label class="form-label">URl Handle</label>
            <input type="text" class="form-control" formControlName="urlHandle">
        </div>

        <div class="mb-3">
            <div class="d-flex flex-row">
                <div class="col-6 p-2">
                    <label class="form-label">Content</label>
                    <textarea class="form-control" formControlName="content" row="5"></textarea>
               </div>
               <div class="col-6 p-2" style="max-height: 350px;overflow-y: scroll;">
                    <markdown [data]="editBlogPostForm.controls.content.getRawValue()"></markdown>
               </div>
            </div>
        </div>

         <div class="mb-3">
            <label class="form-label">Feature Image URL</label>

            @if(editBlogPostForm.controls.featureImageUrl.getRawValue()){
                <div>
                    <img style="width: 100px;" class="my-2" [src]="editBlogPostForm.controls.featureImageUrl.getRawValue()">
                </div>
            }

            <input type="text" class="form-control" formControlName="featureImageUrl">
        </div>

         <div class="mb-3">
            <label class="form-label">Published Date</label>
            <input type="date" class="form-control" formControlName="publishedDate">
        </div>

        <div class="mb-3">
            <label class="form-label">Author</label>
            <input type="text" class="form-control" formControlName="author">
        </div>

        <div class="mb-3">
            <div class="form-check">
                <input class="form-check-input" formControlName="isVisible" type="checkbox" value="" id="isVisible">
                <label class="form-check-label" for="isVisible">IsVisible?</label>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Categories</label>

            <select
                multiple
                class="form-control"
                formControlName="categories">

                @for (category of categoriesResponse(); track category.id) {
                <option [value]="category.id">
                    {{ category.name }}
                </option>
                }

            </select>
        </div>

        <div class="bt-3 d-flex gap-4">
            <button class="btn btn-primary" type="submit">Save</button>
            <button type="submit" class="btn btn-danger" (click)="onDelete()">Delete</button>
        </div>
    </form>

</div><br><br>
